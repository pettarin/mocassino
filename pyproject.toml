[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "mocassino"
version = "0.0.1"
description = "Lightweight audio player based on MOC for Raspberry Pi Zero 2 devices with Pimoroni Pirate Audio hats"
authors = [
    {name = "Alberto Pettarin", email = "alberto@albertopettarin.it"}
]
maintainers = [
    {name = "Alberto Pettarin", email = "alberto@albertopettarin.it"}
]
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "gpiod>=2.6.0",
    "gpiodevice>=0.1.0",
    "gpiozero>=2.0.1.post3",
    "pillow>=13.0.0",
    "spidev>=3.8",
    "st7789>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "coverage>=7.0.0",
    "lucio>=0.0.9",
    "mypy>=2.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=9.1.0",
    "ruff>=0.16.0",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[project.urls]
Documentation = "https://www.albertopettarin.it/mocassino/docs/"
Download = "https://github.com/pettarin/mocassino#installation"
Homepage = "https://github.com/pettarin/mocassino"
"Release Notes" = "https://github.com/pettarin/mocassino/blob/main/docs/CHANGELOG.md"
Source = "https://github.com/pettarin/mocassino"
Tracker = "https://github.com/pettarin/mocassino/issues"

[project.scripts]
mocassino = "mocassino.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

#[tool.setuptools.package-data]
#"mocassino.cli" = ["res/*.template"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=mocassino --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
plugins = []
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
extra_checks = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
